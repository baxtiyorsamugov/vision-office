name: vision-office

x-common-environment: &common-environment
  PYTHONUNBUFFERED: "1"
  VISION_OFFICE_EXTERNAL_EDGE_SYNC: "true"
  VISION_OFFICE_DATABASE_URL: postgresql+psycopg://${VISION_OFFICE_POSTGRES_USER:-vision_office}:${VISION_OFFICE_POSTGRES_PASSWORD:-vision-office-local-only}@postgres:5432/${VISION_OFFICE_POSTGRES_DB:-vision_office}
  # Ultralytics only stores transient runtime preferences here. Keep them out
  # of the Windows bind mount, whose permissions differ from Linux containers.
  YOLO_CONFIG_DIR: /tmp/vision-office-yolo

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped
  stop_grace_period: 45s
  environment: *common-environment
  volumes:
    - ./config:/app/config:ro
    - ./data:/app/data
    - ./models:/app/models:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VISION_OFFICE_POSTGRES_DB:-vision_office}
      POSTGRES_USER: ${VISION_OFFICE_POSTGRES_USER:-vision_office}
      POSTGRES_PASSWORD: ${VISION_OFFICE_POSTGRES_PASSWORD:-vision-office-local-only}
    volumes:
      - vision-office-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    <<: *common
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "database.manager"]

  vision-worker:
    <<: *common
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *common-environment
      VISION_OFFICE_HEADLESS: "true"
    command: ["python", "main.py"]
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py", "worker"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 120s

  edge-sync:
    <<: *common
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "core.edge.sync_worker"]

  api:
    <<: *common
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *common-environment
      VISION_OFFICE_API_KEY: ${VISION_OFFICE_API_KEY:-}
      VISION_OFFICE_CORS_ORIGINS: ${VISION_OFFICE_CORS_ORIGINS:-}
    command: ["python", "-m", "uvicorn", "api.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py", "api"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  ui:
    <<: *common
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *common-environment
      VISION_OFFICE_MANAGED_RUNTIME: "true"
      VISION_OFFICE_API_PUBLIC_URL: ${VISION_OFFICE_API_PUBLIC_URL:-http://127.0.0.1:8000}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    command: ["python", "-m", "streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py", "ui"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  vision-office-postgres:
