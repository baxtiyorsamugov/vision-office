system:
  gpu_enabled: true
  resolution: [640, 640]
  log_level: "INFO"

cameras:
  - id: "reception_01"
    name: "Reception entry"
    rtsp_url: "rtsp://USERNAME:PASSWORD@CAMERA_IP:554/Streaming/Channels/101"
    is_active: true
    event_type: "entry"
    location: "Reception"

ai:
  yolo_model: "yolov8n.pt"
  conf_threshold: 0.5
  iou_threshold: 0.45
  # Higher input detail for distant faces. RTX 3070 is the target runtime.
  face_detection_imgsz: 960
  # Overlay refresh rate. The detector keeps only the newest camera frame.
  face_detection_fps: 20
  # Local browser monitor uses the already-decoded camera frame. It never opens
  # a second RTSP connection and discards stale preview frames under load.
  monitor_preview_fps: 4
  monitor_preview_width: 960
  monitor_preview_jpeg_quality: 70

database:
  # Docker Compose overrides this with its local PostgreSQL service.
  # Keep SQLite only for an existing native Windows installation.
  type: "sqlite"
  path: "data/office.db"

security:
  night_mode_start: "20:00"
  night_mode_end: "07:30"

# Keep device_api_key only in the untracked settings.yaml on each edge computer.
# The backend is the source of people and embeddings; this computer only caches them.
edge_integration:
  enabled: false
  base_url: "https://backend.example.com"
  device_api_key: "REPLACE_ON_DEVICE_ONLY"
  device_id: "REPLACE_WITH_DEVICE_UUID"
  # ERP employees are synchronized into the local database once per hour.
  sync_interval_seconds: 3600
  full_sync_interval_seconds: 86400
  page_size: 200
  # An operator may add up to this many approved local photos per ERP person.
  local_reference_photo_limit: 10
  # Outbox delivery is independent from the hourly people synchronization.
  delivery_poll_interval_seconds: 5
  recognition_threshold: 0.40
  event_cooldown_seconds: 60
  request_timeout_seconds: 10
  timezone: "Asia/Tashkent"

# Telegram is optional. Keep its token and chat ids only in settings.yaml.
health:
  enabled: true
  check_interval_seconds: 5
  failure_threshold: 3
  heartbeat_interval_seconds: 60
  telegram_enabled: false
  telegram_bot_token: "REPLACE_ON_DEVICE_ONLY"
  telegram_chat_ids: []
